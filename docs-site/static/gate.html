<!DOCTYPE html>
<html lang=en>
<head>
  <meta charset=UTF-8>
  <meta name=viewport content=width=device-width, initial-scale=1>
  <title>Server Kit — Access</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117; --panel: #161b22; --border: #30363d;
      --text: #e6edf3; --muted: #7d8590; --accent: #58a6ff;
      --green: #3fb950; --red: #f85149;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    body { display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 40px 36px; width: 100%; max-width: 360px; text-align: center;
    }
    .logo { font-size: 42px; margin-bottom: 12px; line-height: 1; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .sub { font-size: 12px; color: var(--muted); margin-bottom: 28px; }
    input[type=password] {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 15px; padding: 10px 14px;
      outline: none; margin-bottom: 12px; transition: border-color .15s;
    }
    input[type=password]:focus { border-color: var(--accent); }
    button {
      width: 100%; background: var(--accent); border: none; border-radius: 6px;
      color: #0d1117; font-size: 14px; font-weight: 600; padding: 10px;
      cursor: pointer; transition: opacity .15s;
    }
    button:hover { opacity: .88; }
    .err { font-size: 12px; color: var(--red); margin-top: 12px; min-height: 18px; }
    .footer { font-size: 10px; color: var(--muted); margin-top: 24px; letter-spacing: .3px; }
  </style>
</head>
<body>
  <div class=card>
    <div class=logo>🖥</div>
    <h1>Server Kit Docs</h1>
    <p class=sub>Private reference — access required</p>
    <form id=f>
      <input type=password id=pw placeholder=Password autocomplete=current-password autofocus>
      <button type=submit>Enter →</button>
    </form>
    <div class=err id=err></div>
    <div class=footer>Home server control panel · fks-services</div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);

    // Clear bad cookie + show error if redirected back with ?err=1
    if (params.get('err')) {
      document.cookie = 'hub_docs_auth=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; SameSite=Strict';
      document.getElementById('err').textContent = 'Incorrect password — try again.';
    }

    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('pw').value;
      if (!pw) return;
      const buf  = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
      const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
      const exp  = new Date(Date.now() + 86400000 * 7).toUTCString(); // 7 days
      document.cookie = `hub_docs_auth=${hash}; expires=${exp}; path=/; SameSite=Strict`;
      window.location.href = params.get('from') || '/';
    });
  </script>
</body>
</html>
