services:
  adminer:
    image: adminer:latest
    container_name: adminer
    restart: always
    ports:
      - "8083:8080"
    environment:
      ADMINER_DEFAULT_SERVER: supabase-db
      ADMINER_DESIGN: dracula
    networks:
      - proxy
      - supabase-net

networks:
  proxy:
    external: true
  supabase-net:
    external: true
