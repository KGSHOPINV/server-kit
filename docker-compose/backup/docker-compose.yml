# =============================================================================
# WATCHTOWER (backup copy) — Automatically updates all running Docker containers
# =============================================================================
# Port:        None — runs as a background daemon, no web UI
# Access:      No UI — check logs to see what was updated
# Credentials: None required
# Data:        No persistent data — reads Docker socket to detect and pull updates
# Depends on:  proxy network must exist (created by npm compose)
# Start:       cd /srv/docker/backup && docker compose up -d
# Stop:        cd /srv/docker/backup && docker compose down
# Logs:        cd /srv/docker/backup && docker compose logs -f
# Update:      cd /srv/docker/backup && docker compose pull && docker compose up -d
# Schedule:    Runs container updates daily at 4:00 AM (cron: 0 0 4 * * *)
# Note:        This is a backup/alternate copy of the watchtower config.
#              If watchtower/ is already running, do NOT run both at the same time.
# =============================================================================

services:
  # Watchtower - auto-updates Docker containers
  watchtower:
    image: containrrr/watchtower:latest     # official Watchtower image
    container_name: watchtower
    restart: always                         # auto-restarts on crash or reboot
    environment:
      - WATCHTOWER_CLEANUP=true             # removes old images after updating (saves disk space)
      - WATCHTOWER_SCHEDULE=0 0 4 * * *    # cron schedule — runs at 4:00 AM every day
      - WATCHTOWER_INCLUDE_STOPPED=false    # only updates currently running containers
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # gives Watchtower access to Docker daemon
    networks:
      - proxy                               # must exist — created by npm compose (03-npm-setup.sh)

networks:
  proxy:
    external: true    # must exist — created by npm compose (03-npm-setup.sh)
