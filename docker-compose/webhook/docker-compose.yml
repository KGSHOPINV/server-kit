services:
  webhook:
    image: almir/webhook:latest
    container_name: webhook
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - ./hooks.json:/etc/webhook/hooks.json
      - ./scripts:/scripts
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/docker:/srv/docker
    command: -verbose -hooks=/etc/webhook/hooks.json -hotreload
    networks:
      - proxy

networks:
  proxy:
    external: true
