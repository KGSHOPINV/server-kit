services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=${TZ:-America/New_York}
      # IMPORTANT: Set N8N_ENCRYPTION_KEY in your .env file
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-changeme-set-this-in-your-env}
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - proxy

volumes:
  n8n-data:

networks:
  proxy:
    external: true
